<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 36 1135 529" width="1135" height="529" role="img" aria-labelledby="title desc">
  <title id="title">You, the canvas, your agent and the presentation</title>
  <desc id="desc">A loop. You mark up slides and submit the review to the canvas, and the canvas passes your feedback to your agent as data. The agent edits and saves the presentation, the canvas renders it again, and you see fresh slide images.</desc>
  <defs>
    <filter id="lift" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B2B4B" flood-opacity="0.12"/>
    </filter>
    <!-- Open heads with round caps. The line ends at the tip of the head, so nothing sticks out. -->
    <marker id="head-blue" viewBox="0 0 20 20" refX="13" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M3 3 L13 10 L3 17" fill="none" stroke="#0B6BCB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="head-teal" viewBox="0 0 20 20" refX="13" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M3 3 L13 10 L3 17" fill="none" stroke="#0F9D8A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Yu Gothic UI', 'Meiryo UI', sans-serif; fill: #232B3A; }
    .name { font-size: 28px; font-weight: 600; fill: #1B2B4B; }
    .sub { font-size: 16px; fill: #5B6475; }
    .flow { font-size: 20px; font-weight: 600; }
    .flow-blue { fill: #0B6BCB; }
    .flow-teal { fill: #0F9D8A; }
    .head { font-size: 30px; font-weight: 600; fill: #FFFFFF; }
    .btn { font-size: 18px; font-weight: 600; fill: #FFFFFF; }
    .pin { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
  </style>

  <rect x="80" y="36" width="1135" height="529" fill="#FFFFFF"/>

  <g transform="translate(0 -60)">
    <!-- You -->
    <g fill="#1B2B4B">
      <circle cx="160" cy="300" r="26"/>
      <path d="M104 388 C104 352 128 334 160 334 C192 334 216 352 216 388 Z"/>
    </g>
    <text class="name" x="160" y="432" text-anchor="middle">You</text>

    <!-- Canvas -->
    <rect x="520" y="120" width="280" height="448" rx="24" fill="#0F9D8A" filter="url(#lift)"/>
    <text class="head" x="660" y="174" text-anchor="middle">Canvas</text>
    <rect x="548" y="192" width="224" height="48" rx="12" fill="#0B6BCB"/>
    <text class="btn" x="660" y="222" text-anchor="middle">Submit review</text>
    <g transform="translate(548 258)">
      <rect width="224" height="168" rx="10" fill="#FFFFFF"/>
      <rect x="16" y="16" width="44" height="5" rx="2.5" fill="#0F9D8A"/>
      <rect x="16" y="28" width="110" height="8" rx="4" fill="#1B2B4B"/>
      <rect x="22" y="110" width="26" height="38" fill="#B7C1DC"/>
      <rect x="58" y="98" width="26" height="50" fill="#B7C1DC"/>
      <rect x="94" y="86" width="26" height="62" fill="#B7C1DC"/>
      <rect x="130" y="56" width="26" height="92" fill="#0F9D8A"/>
      <rect x="166" y="34" width="26" height="114" fill="#0F9D8A"/>
      <ellipse cx="161" cy="90" rx="48" ry="52" transform="rotate(-8 161 90)" fill="none" stroke="#E5322D" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="208" cy="16" r="11" fill="#0B6BCB"/>
      <text class="pin" x="208" y="20.5" text-anchor="middle">1</text>
    </g>
    <g transform="translate(548 444)">
      <rect width="224" height="96" rx="10" fill="#FFFFFF"/>
      <circle cx="22" cy="24" r="10" fill="#0B6BCB"/>
      <text class="pin" x="22" y="28.5" text-anchor="middle">1</text>
      <rect x="42" y="19" width="120" height="9" rx="4.5" fill="#DCE1EA"/>
      <rect x="16" y="48" width="190" height="8" rx="4" fill="#DCE1EA"/>
      <rect x="16" y="66" width="140" height="8" rx="4" fill="#DCE1EA"/>
    </g>

    <!-- Agent -->
    <g fill="#1B2B4B">
      <line x1="1110" y1="166" x2="1110" y2="144" stroke="#1B2B4B" stroke-width="4" stroke-linecap="round"/>
      <circle cx="1110" cy="136" r="8" fill="#0F9D8A"/>
      <rect x="1060" y="166" width="100" height="100" rx="24"/>
      <rect x="1042" y="194" width="14" height="44" rx="7"/>
      <rect x="1164" y="194" width="14" height="44" rx="7"/>
      <circle cx="1086" cy="212" r="9" fill="#FFFFFF"/>
      <circle cx="1134" cy="212" r="9" fill="#FFFFFF"/>
    </g>
    <text class="name" x="1110" y="306" text-anchor="middle">Agent</text>

    <!-- Presentation -->
    <g transform="translate(1030 442)">
      <rect width="160" height="90" rx="12" fill="#FFFFFF" stroke="#DCE1EA" stroke-width="1.5" filter="url(#lift)"/>
      <rect x="14" y="12" width="32" height="4" rx="2" fill="#0F9D8A"/>
      <rect x="14" y="21" width="76" height="6" rx="3" fill="#1B2B4B"/>
      <rect x="16" y="60" width="16" height="18" fill="#B7C1DC"/>
      <rect x="38" y="56" width="16" height="22" fill="#B7C1DC"/>
      <rect x="60" y="52" width="16" height="26" fill="#B7C1DC"/>
      <rect x="82" y="38" width="16" height="40" fill="#0F9D8A"/>
      <rect x="104" y="28" width="16" height="50" fill="#0F9D8A"/>
    </g>
    <text class="name" x="1110" y="574" text-anchor="middle">Presentation</text>
    <text class="sub" x="1110" y="597" text-anchor="middle">.pptx</text>

    <!-- Review: you to canvas to agent (blue). A line ends 2 px before the tip it points to (the round cap). -->
    <g stroke="#0B6BCB" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M240 307 C345 307 405 216 510 216" marker-end="url(#head-blue)"/>
      <line x1="808" y1="216" x2="1030" y2="216" marker-end="url(#head-blue)"/>
    </g>
    <!-- Result: agent to presentation to canvas to you (teal) -->
    <g stroke="#0F9D8A" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="1110" y1="324" x2="1110" y2="430" marker-end="url(#head-teal)"/>
      <line x1="1022" y1="487" x2="812" y2="487" marker-end="url(#head-teal)"/>
      <path d="M512 487 C407 487 355 399 250 399" marker-end="url(#head-teal)"/>
    </g>
    <text class="flow flow-blue" x="500" y="196" text-anchor="end">Mark up, comment, submit</text>
    <text class="flow flow-blue" x="920" y="198" text-anchor="middle">Your feedback, as data</text>
    <text class="flow flow-teal" x="1094" y="385" text-anchor="end">Edits and saves</text>
    <text class="flow flow-teal" x="916" y="517" text-anchor="middle">Renders it again</text>
    <text class="flow flow-teal" x="500" y="517" text-anchor="end">Fresh slide images</text>
  </g>
</svg>
